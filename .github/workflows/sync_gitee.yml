name: Sync GitHub ZIP to Gitee
on:
  # 每 30 分钟自动执行一次（原cron是每日0点，你按需调整）
  schedule:
    - cron: "0 0 * * *"
  # 支持手动执行
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync repository by zip
        env:
          ZIP_URL: https://codeload.github.com/microsoft/winget-pkgs/zip/refs/heads/master
          TARGET_REPO: https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/meizhonghao/winget-pkgs.git
        run: |
          echo "开始下载GitHub master分支ZIP包"
          # 下载zip
          wget -O source.zip "$ZIP_URL"
          # 解压
          unzip -q source.zip
          # 解压目录名称固定为 winget-pkgs-master
          cd winget-pkgs-master
          # 初始化git
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add origin "$TARGET_REPO"
          git add .
          git commit -m "Auto sync from github master zip $(date)" --allow-empty
          # 强制推送覆盖 gitee master 分支
          git push -f origin master
          echo "同步完成"

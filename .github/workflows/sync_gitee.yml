name: Sync GitHub to Gitee

on:
  # 每 30 分钟自动执行一次
  schedule:
    - cron: "* * * * *"

  # 支持手动执行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync repository
        env:
          SOURCE_REPO: https://github.com/microsoft/winget-pkgs
          TARGET_REPO: https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/meizhonghao/winget-pkgs.git

        run: |
          echo "开始同步 GitHub → Gitee"

          git clone --mirror "$SOURCE_REPO" repo.git

          cd repo.git

          git push --mirror "$TARGET_REPO"

          echo "同步完成"
